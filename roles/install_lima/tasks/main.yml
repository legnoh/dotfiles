---

- name: Install Lima
  block:
    - name: Install Rosetta2
      become: true
      ansible.builtin.command:
        cmd: /usr/sbin/softwareupdate --install-rosetta --agree-to-license
      changed_when: false

    - name: Install Lima and Docker CLI tools
      community.general.homebrew:
        name:
          - lima
        state: present

    - name: Create Lima config directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/lima"
        state: directory
        mode: "0755"

    - name: Install Lima Docker instance definition
      ansible.builtin.template:
        src: docker.yaml.j2
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/lima/docker.yaml"
        mode: "0644"
      register: install_lima_config

    - name: Copy Zsh config file
      ansible.builtin.import_role:
        name: misc_create_zshconf
      vars:
        misc_create_zshconf_src: lima.zsh

    - name: Check existing Lima instances
      ansible.builtin.command:
        argv:
          - limactl
          - list
          - --format
          - "{{ '{{.Name}}' }}"
      register: install_lima_instances
      changed_when: false

    - name: Stop Lima instance before recreation
      ansible.builtin.command:
        argv:
          - limactl
          - stop
          - "{{ install_lima_instance_name }}"
      when:
        - install_lima_recreate_instance
        - install_lima_instance_name in install_lima_instances.stdout_lines
      changed_when: true

    - name: Delete Lima instance before recreation
      ansible.builtin.command:
        argv:
          - limactl
          - delete
          - --force
          - "{{ install_lima_instance_name }}"
      when:
        - install_lima_recreate_instance
        - install_lima_instance_name in install_lima_instances.stdout_lines
      changed_when: true

    - name: Create Lima Docker instance
      ansible.builtin.command:
        argv:
          - limactl
          - create
          - --name
          - "{{ install_lima_instance_name }}"
          - --tty=false
          - "{{ ansible_facts['env']['HOME'] }}/.config/lima/docker.yaml"
      when:
        - install_lima_instance_name not in install_lima_instances.stdout_lines or install_lima_recreate_instance
      changed_when: true

    - name: Check Lima instance status before restarting for config changes
      ansible.builtin.command:
        argv:
          - limactl
          - list
          - "{{ install_lima_instance_name }}"
          - --json
      register: install_lima_status_before_restart
      changed_when: false
      when:
        - not ansible_check_mode
        - install_lima_config.changed
        - not install_lima_recreate_instance
        - install_lima_instance_name in install_lima_instances.stdout_lines

    - name: Stop Lima instance when its config changed
      ansible.builtin.command:
        argv:
          - limactl
          - stop
          - "{{ install_lima_instance_name }}"
      when:
        - not ansible_check_mode
        - install_lima_config.changed
        - not install_lima_recreate_instance
        - install_lima_instance_name in install_lima_instances.stdout_lines
        - (install_lima_status_before_restart.stdout | from_json)['status'] == 'Running'
      changed_when: true

    - name: Start Lima Docker instance
      ansible.builtin.command:
        argv:
          - limactl
          - start
          - "{{ install_lima_instance_name }}"
          - --tty=false
      register: install_lima_start
      changed_when: "'Already running' not in install_lima_start.stdout"

    - name: Wait for Lima Docker instance to be fully running
      ansible.builtin.command:
        argv:
          - limactl
          - list
          - "{{ install_lima_instance_name }}"
          - --json
      register: install_lima_status
      changed_when: false
      until: (install_lima_status.stdout | from_json)['status'] == 'Running'
      retries: 60
      delay: 5
      when: not ansible_check_mode

    - name: Enable Lima autostart
      ansible.builtin.command:
        argv:
          - limactl
          - autostart
          - enable
          - "{{ install_lima_instance_name }}"
      changed_when: false
